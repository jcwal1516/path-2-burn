[project]
name = "path-2-burn-export"
version = "0.1.0"
description = "Offline torch reference generation for path-2-burn. Never shipped."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "numpy>=2",
    "einops>=0.8",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "openslide-python>=1.4",
    "openslide-bin>=4",
    "timm>=1.0",
    "transformers>=4.46",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "cellpose>=4.0",
]

[tool.uv]
package = false
