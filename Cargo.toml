[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Burn main (0.23.0-pre.1). Its workspace pins cubecl/cubek by git rev; keep the
# direct cubecl-* deps below on the same cubecl rev when bumping this.
burn = { git = "https://github.com/tracel-ai/burn", rev = "75eb34debc47d6f3c90119ad07e59b023a3e4010", default-features = false }
burn-store = { git = "https://github.com/tracel-ai/burn", rev = "75eb34debc47d6f3c90119ad07e59b023a3e4010", default-features = false }

[package]
name = "path-2-burn"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Pathology models in Burn, loading the published checkpoints by their original parameter names."

[dependencies]
burn = { workspace = true, features = ["std", "wgpu", "flex", "autotune", "fusion"] }
burn-store = { workspace = true, features = ["std", "memmap", "pytorch", "safetensors"] }
sam-burn = { path = "crates/sam-burn" }
vit-burn = { path = "crates/vit-burn" }
# Device selection probes wgpu adapters; same cubecl rev as burn's workspace.
cubecl-runtime = { git = "https://github.com/tracel-ai/cubecl", rev = "10642912bdf1f8c3d86e23b9a7f94a970b21d076", default-features = false }
cubecl-wgpu = { git = "https://github.com/tracel-ai/cubecl", rev = "10642912bdf1f8c3d86e23b9a7f94a970b21d076", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { workspace = true, features = ["metal"] }

[profile.dev.package."*"]
opt-level = 3
